name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_BASE: https://hookster-server.onrender.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Generate native Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (arm64 only, faster)
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Locate APK
        run: |
          APK=$(find app/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found: $APK"
          cp "$APK" Hookster.apk
          ls -la Hookster.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Hookster-apk
          path: Hookster.apk

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" Hookster.apk --repo "${{ github.repository }}" --title "Hookster APK build ${{ github.run_number }}" --notes "Android APK (devnet test build). Install on an Android phone with Phantom or Solflare set to Devnet."
          echo "APK URL: https://github.com/${{ github.repository }}/releases/download/$TAG/Hookster.apk"
