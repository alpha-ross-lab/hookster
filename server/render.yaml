# ПРОЕКТ: Hookster (хакатон Solana) — server/render.yaml
services:
  - type: web
    name: hookster-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: DRIVE_FOLDER_ID
        value: 1RmzEoJAG74VDVlbNTa9UGLte16-SiTep
      - key: DRIVE_API_KEY
        sync: false
      - key: TREASURY_ADDRESS
        sync: false
      - key: SOLANA_CLUSTER
        value: devnet
